/* PREMIUM HEADER - improved depth & shine */

.premium-header{
  background: radial-gradient(120% 120% at 10% 0%, rgba(56,189,248,0.25) 0%, transparent 40%), radial-gradient(90% 90% at 90% 20%, rgba(99,102,241,0.22) 0%, transparent 50%), linear-gradient(135deg,#0f172a 0%,#1e293b 45%,#334155 100%);
  border-radius:20px;
  padding:14px 24px;
  margin-bottom:22px;
  box-shadow:0 20px 50px -12px rgba(15,23,42,0.6), 0 0 0 1px rgba(56,189,248,0.18) inset, inset 0 1px 0 rgba(255,255,255,0.08), inset 0 -1px 0 rgba(0,0,0,0.2);
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  border:1px solid rgba(56,189,248,0.22);
  position:relative;
  overflow:hidden;
}

.premium-header::before{
  content:"";
  position:absolute;
  top:-50%;
  left:-30%;
  width:60%;
  height:200%;
  background:linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.06) 45%, rgba(56,189,248,0.12) 50%, transparent 60%);
  transform:rotate(8deg);
  pointer-events:none;
  animation:headerShine 8s ease-in-out infinite;
}

@keyframes headerShine{
  0%,100%{
    transform:translateX(-20%) rotate(8deg);
    opacity:0
  }

  50%{
    transform:translateX(180%) rotate(8deg);
    opacity:1
  }
}

  gap:18px
}

.precificacao-col{
  background:#f8fafc;
  border-radius:22px;
  padding:18px;
  border:1px solid rgba(56,189,248,0.1)
}

.precificacao-col h4{
  color:#0f172a;
  font-size:0.85rem;
  margin-bottom:14px;
  padding-bottom:8px;
  border-bottom:2px solid rgba(56,189,248,0.15)
}

.precificacao-col .input-group{
  margin-bottom:12px
}

.resultado-precificacao-box{
  grid-column:1 / -1;
  background:linear-gradient(145deg,#f0f9ff,#e0f2fe);
  border-radius:22px;
  padding:20px;
  border:1px solid #7dd3fc;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:14px;
  text-align:center;
  box-shadow:0 6px 20px rgba(14,165,233,0.08)
}

.resultado-item{
  padding:8px
}

.resultado-item .res-label{
  font-size:0.72rem;
  color:#475569;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.4px
}

.resultado-item .res-valor{
  font-size:1.2rem;
  font-weight:800;
  color:#020617;
  margin-top:4px
}

.resultado-item .res-valor.destaque{
  color:#0369a1;
  font-size:1.5rem
}

.resultado-item .res-valor.lucro{
  color:#15803d
}

@media (max-width:600px){
  .precificacao-grid{
    grid-template-columns:1fr
  }
}

@media (max-width:680px){
  .app-container{
    padding:10px 12px 32px
  }

  .form-grid{
    flex-direction:column
  }

  .logo-area h1{
    font-size:1.05rem
  }

  .header-actions{
    width:100%;
    justify-content:center
  }

  .card .valor{
    font-size:1.5rem
  }

  .btn-glass{
    font-size:0.72rem;
    padding:6px 10px
  }

  .btn-glass span.btn-label{
    display:none
  }
}

.cat-tags-scroll{
  display:flex;
  flex-wrap:nowrap;
  overflow-x:auto;
  overflow-y:hidden;
  gap:8px;
  padding:14px;
  margin-top:14px;
  background:#f8fafc;
  border:1.5px solid rgba(56,189,248,0.15);
  border-radius:18px;
  align-items:center;
  scrollbar-width:thin;
  scrollbar-color:#cbd5e1 transparent;
  scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;
}

.cat-tags-scroll::-webkit-scrollbar{
  height:4px
}

.cat-tags-scroll::-webkit-scrollbar-track{
  background:transparent;
  border-radius:10px
}

.cat-tags-scroll::-webkit-scrollbar-thumb{
  background:#cbd5e1;
  border-radius:10px
}

.cat-tag-pai{
  flex:0 0 auto;
  min-width:110px;
  max-width:200px;
  height:38px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:0 14px;
  border-radius:30px;
  font-size:0.78rem;
  font-weight:700;
  color:white;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  scroll-snap-align:start;
  cursor:default;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
  transition:transform 0.15s ease;
}

.cat-tag-pai:hover{
  transform:translateY(-1px);
  box-shadow:0 4px 10px rgba(0,0,0,0.15)
}

.cat-tag-sub{
  flex:0 0 auto;
  min-width:100px;
  max-width:180px;
  height:34px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:0 12px;
  border-radius:30px;
  font-size:0.74rem;
  font-weight:600;
  color:#0c4a6e;
  background:white;
  border:1.5px solid #7dd3fc;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  scroll-snap-align:start;
  box-shadow:0 1px 4px rgba(14,165,233,0.08);
  transition:transform 0.15s ease;
}

.cat-tag-sub:hover{
  transform:translateY(-1px);
  box-shadow:0 3px 8px rgba(14,165,233,0.15)
}

.cat-tag-remove{
  background:none;
  border:none;
  color:#94a3b8;
  cursor:pointer;
  font-size:0.68rem;
  padding:2px 5px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  width:20px;
  height:20px;
  flex-shrink:0;
  transition:all 0.15s;
  box-shadow:none;
}

.cat-tag-remove:hover{
  background:#fef2f2;
  color:#dc2626
}

.cat-tags-empty{
  width:100%;
  text-align:center;
  color:#94a3b8;
  font-style:italic;
  font-size:0.85rem;
  padding:8px 0
}

@media (max-width:540px){
  .cat-tag-pai{
    min-width:95px;
    max-width:160px;
    height:36px;
    font-size:0.74rem;
    padding:0 10px
  }

  .cat-tag-sub{
    min-width:85px;
    max-width:150px;
    height:32px;
    font-size:0.7rem;
    padding:0 10px
  }
}

.vendas-header-wrap{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:18px;
  flex-wrap:wrap;
  gap:10px
}

.stock-search-container{
  position:relative;
  margin-bottom:16px;
  z-index:50
}

.stock-search-header{
  display:flex;
  align-items:center;
  gap:10px;
  background:#f8fafc;
  border:1.5px solid #cbd5e1;
  border-radius:20px;
  padding:0 14px;
  transition:all 0.25s ease;
}

.stock-search-header:focus-within{
  border-color:#0ea5e9;
  box-shadow:0 0 0 3px rgba(14,165,233,0.18);
  background:white
}

.stock-search-header .ss-icon{
  color:#94a3b8;
  font-size:0.88rem;
  flex-shrink:0;
  transition:color 0.2s
}

.stock-search-header:focus-within .ss-icon{
  color:#0ea5e9
}

.stock-search-input{
  border:none !important;
  background:transparent !important;
  box-shadow:none !important;
  padding:11px 0 !important;
  border-radius:0 !important;
  width:100%;
  font-size:0.88rem;
  color:#1a1a1a;
}

.stock-search-input:focus{
  outline:none !important
}

.stock-search-input::-moz-placeholder{
  color:#94a3b8
}

.stock-search-input::placeholder{
  color:#94a3b8
}

.stock-search-counter{
  flex-shrink:0;
  font-size:0.7rem;
  font-weight:700;
  color:#94a3b8;
  background:#f1f5f9;
  padding:2px 8px;
  border-radius:20px;
  white-space:nowrap;
  transition:all 0.2s;
  display:none;
}

.stock-search-counter.visible{
  display:block
}

.stock-search-counter.has-results{
  color:#0ea5e9;
  background:#f0f9ff
}

.stock-search-results{
  position:absolute;
  top:100%;
  left:0;
  right:0;
  z-index:100;
  background:white;
  border:1.5px solid #e2e8f0;
  border-radius:18px;
  margin-top:6px;
  max-height:380px;
  overflow-y:auto;
  box-shadow:0 16px 40px rgba(15,23,42,0.14), 0 0 0 1px rgba(15,23,42,0.03);
  scrollbar-width:thin;
  scrollbar-color:#cbd5e1 transparent;
  animation:ssResultsIn 0.2s ease;
}

@keyframes ssResultsIn{
  from{
    opacity:0;
    transform:translateY(-6px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.stock-search-results::-webkit-scrollbar{
  width:5px
}

.stock-search-results::-webkit-scrollbar-track{
  background:transparent
}

.stock-search-results::-webkit-scrollbar-thumb{
  background:#cbd5e1;
  border-radius:10px
}

.stock-search-item{
  padding:12px 16px;
  cursor:pointer;
  transition:background 0.15s;
  border-bottom:1px solid #f1f5f9;
}

.stock-search-item:last-child{
  border-bottom:none
}

.stock-search-item:hover{
  background:#f0f9ff
}

.stock-search-item:active{
  background:#e0f2fe
}

.stock-search-item.out-of-stock{
  background:#fef2f2;
  opacity:0.7
}

.stock-search-item.out-of-stock:hover{
  background:#fee2e2
}

.stock-search-item-main{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.stock-search-item-name{
  font-weight:600;
  color:#1a1a1a;
  font-size:0.88rem;
  line-height:1.3
}

.stock-search-item-name mark{
  background:#bae6fd;
  color:#0c4a6e;
  border-radius:3px;
  padding:0 2px;
  font-weight:700
}

.stock-search-item-price{
  font-weight:800;
  color:#0369a1;
  font-size:0.95rem;
  white-space:nowrap;
  flex-shrink:0
}

.stock-search-item-data{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:6px;
  flex-wrap:wrap
}

.stock-badge{
  padding:2px 9px;
  border-radius:20px;
  font-size:0.66rem;
  font-weight:700;
  color:white;
  display:inline-flex;
  align-items:center;
  gap:3px;
  letter-spacing:0.2px;
}

.stock-badge-ok{
  background:#10b981
}

.stock-badge-baixo{
  background:#f59e0b
}

.stock-badge-zero{
  background:#ef4444
}

.stock-search-item-cat{
  padding:2px 9px;
  border-radius:20px;
  font-size:0.66rem;
  font-weight:600;
  color:#0c4a6e;
  background:#e0f2fe;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:140px;
}

.stock-search-item-custo{
  font-size:0.74rem;
  color:#64748b
}

.stock-search-item-margem{
  font-size:0.68rem;
  font-weight:700;
  padding:2px 7px;
  border-radius:20px
}

.stock-search-item-margem.positiva{
  color:#15803d;
  background:#f0fdf4
}

.stock-search-item-margem.negativa{
  color:#b91c1c;
  background:#fef2f2
}

.stock-search-item-margem.neutra{
  color:#64748b;
  background:#f1f5f9
}

.stock-search-empty{
  text-align:center;
  color:#94a3b8;
  padding:28px 16px
}

.stock-search-empty span{
  font-size:0.85rem;
  font-style:italic
}

.stock-search-hint{
  text-align:center;
  color:#94a3b8;
  font-size:0.72rem;
  padding:8px;
  border-top:1px solid #f1f5f9;
  font-style:italic;
}

@media (max-width:540px){
  .stock-search-results{
    max-height:300px;
    border-radius:16px
  }

  .stock-search-item{
    padding:10px 12px
  }

  .stock-search-item-name{
    font-size:0.84rem
  }

  .stock-search-item-price{
    font-size:0.88rem
  }
}

/* === WHATSAPP INLINE BUTTON - PREMIUM === */

.wa-inline-btn{
  width:28px;
  height:28px;
  border-radius:50%;
  background:linear-gradient(145deg,#e8f5e9,#dcfce7);
  border:1.5px solid #86efac;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:#16a34a;
  font-size:0.9rem;
  text-decoration:none;
  transition:all 0.22s cubic-bezier(.25,.46,.45,.94);
  flex-shrink:0;
  box-shadow:0 2px 6px rgba(34,197,94,0.15), inset 0 1px 0 rgba(255,255,255,0.8);
  cursor:pointer;
  position:relative;
}

.wa-inline-btn::after{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:50%;
  border:1.5px solid rgba(34,197,94,0);
  transition:all 0.22s ease;
}

.wa-inline-btn:hover{
  background:linear-gradient(145deg,#25D366,#128C7E);
  color:white;
  border-color:#16a34a;
  transform:scale(1.12) translateY(-1px);
  box-shadow:0 6px 16px rgba(34,197,94,0.32), 0 0 0 1px rgba(255,255,255,0.3) inset;
}

.wa-inline-btn:hover::after{
  border-color:rgba(34,197,94,0.25);
  inset:-4px
}

.wa-inline-btn:active{
  transform:scale(0.96)
}

.wa-inline-btn.disabled{
  background:#f1f5f9;
  border-color:#e2e8f0;
  color:#94a3b8;
  cursor:not-allowed;
  box-shadow:none;
  opacity:0.6;
}

.wa-inline-btn.disabled:hover{
  transform:none;
  background:#f1f5f9;
  color:#94a3b8;
  box-shadow:none;
  border-color:#e2e8f0
}

/* WhatsApp pulse when debt >0 */

.wa-inline-btn.has-debt{
  animation:waPulse 2.2s ease-in-out infinite
}

@keyframes waPulse{
  0%,100%{
    box-shadow:0 2px 6px rgba(34,197,94,0.15)
  }

  50%{
    box-shadow:0 2px 10px rgba(34,197,94,0.32), 0 0 0 4px rgba(34,197,94,0.10)
  }
}

/* WhatsApp modal & boxes */

.whatsapp-box{
  background:linear-gradient(145deg,#f0fdf4,#ecfdf5);
  border:1px solid #bbf7d0;
  border-radius:20px;
  padding:16px;
  margin-top:16px;
  box-shadow:0 4px 16px rgba(34,197,94,0.06)
}

.btn-whatsapp{
  background:linear-gradient(145deg,#128C7E,#25D366) !important;
  box-shadow:0 4px 14px -2px rgba(37,211,102,0.45), inset 0 1px 0 rgba(255,255,255,0.2) !important;
  color:white !important;
  border:1px solid rgba(22,163,74,0.2) !important
}

.btn-whatsapp:hover{
  filter:brightness(1.06);
  transform:translateY(-1.5px) scale(1.01);
  box-shadow:0 8px 20px -4px rgba(37,211,102,0.5), inset 0 1px 0 rgba(255,255,255,0.25) !important
}

.whatsapp-quick-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px
}

@media (max-width:540px){
  .whatsapp-quick-grid{
    grid-template-columns:1fr
  }
}

.wa-textarea{
  width:100%;
  min-height:90px;
  padding:12px 14px;
  border-radius:16px;
  border:1.5px solid #bbf7d0;
  background:white;
  resize:vertical;
  font-size:0.88rem;
  transition:all 0.22s ease
}

.wa-textarea:focus{
  outline:none;
  border-color:#25D366;
  box-shadow:0 0 0 3px rgba(37,211,102,0.18), 0 2px 8px rgba(37,211,102,0.08)
}

/* micro animations */

.client-row, .estoque-item, .produto-card, .pagamento-card, .historico-item{
  will-change:transform
}

button, .tab-grid-btn, .cat-btn, .wa-inline-btn{
  will-change:transform
}

/* premium client name wrapper */

.client-name-wrap{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0
}

.client-name-wrap strong{
  overflow-wrap:anywhere;
  min-width:0
}

/* large green button in modal */

.wa-big-btn{
  width:100%;
  margin-top:12px;
  justify-content:center;
  padding:13px 18px;
  border-radius:18px;
  font-weight:700;
  font-size:0.92rem;
  background:linear-gradient(145deg,#16a34a,#25D366) !important;
  box-shadow:0 6px 20px rgba(34,197,94,0.28), inset 0 1px 0 rgba(255,255,255,0.2) !important;
  letter-spacing:0.2px;
}

.wa-big-btn:hover{
  transform:translateY(-1.5px) scale(1.01);
  box-shadow:0 10px 28px rgba(34,197,94,0.36), inset 0 1px 0 rgba(255,255,255,0.25) !important
}
